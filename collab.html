<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a job</title>
</head>
<body>
    <article>
        <h1>Trabalhe Conosco</h1>
        <form>
            <label for="fullname">Nome Completo</label>
            <input id="fullname" type="text"><br>
            <label for="socname">Nome Social</label>
            <input type="text" id="socname"><br>
            <label for="phone">Numero do celular</label>
            <input id="phone" type="tel"><br>
            <label for="email">E-Mail</label>
            <input id="email" type="email"><br>
            <label for="curr">Curriculo</label>
            <input type="file" id="curr"><br>
            <button type="submit">Ok!</button>
            <button type="reset">Resetar!</button>
        </form>
    </article>
</body>
</html>
